[project]
name = "personal-assistant"
version = "0.1.0"
description = "Personal schedule planner: server, web, mobile, and CLI over one backend"
jac-version = "==0.37.14"
default-app = "web"

[dependencies]
icalendar = "~=7.3"
recurring-ical-events = "~=3.8"
requests = "~=2.34"
byllm = "~=0.6"
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"



# `jac test` runs everything: unit tests (core/*.test.jac) and endpoint tests.
[test]
directories = ["core", "tests", "cli"]

[dev-dependencies]
watchdog = ">=3.0.0"

[client]

[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.web.dependencies.npm]
jac-client-node = "1.0.7"

[apps.web.dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"

# Where code runs. Jac infers server vs browser placement; a pin overrides it.
# web/lib/ui.jac is browser helper code with nothing that marks it as such.
[placement.pins]
"web.lib.ui" = "client"

# The planner doesn't use Jac's built-in admin portal. Disabling it also stops
# the server from creating an "admin" account with a default password.
[scale.admin]
enabled = false

[apps.cli]
kind = "cli"
entry-point = "cli.main"

# The mobile app's backend: walkers in core/mobile_api.jac, declared as a
# service app so the mobile app can call them. `jac run web` runs it in the
# same process as the web server (colocated), against the same database.
[apps.mobile_api]
kind = "service"
entry-point = "core.mobile_api"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.mobile.dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-native-web = "^0.19.13"
react-native-svg = "^15.13.0"
lucide-react = "^0.469.0"
lucide-react-native = "^0.469.0"

[apps.mobile.dependencies.npm.native]
react-native-svg = "^15.13.0"
lucide-react-native = "^0.469.0"
